name: "📄 Report Missing Documentation"
description: Flag a topic, page, or reference that doesn't currently exist in the docs.
title: "[Missing-Docs]: "
labels: ["Type/Missing-Content"]
body:
  - type: textarea
    id: description
    attributes:
      label: What's missing?
      description: Describe the topic, page, or reference content that should exist but doesn't.
      placeholder: e.g. "There's no reference page documenting the rate-limiting policy options."
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Related Section
      description: Which part of the documentation is this missing from?
      options:
        - Cloud
        - API Manager
        - API Gateway
        - AI Gateway
        - Developer Portal
        - AI Workspace
        - Analytics
        - Monetization
        - Policy Hub
        - Tools
        - Guides
        - New / Not Sure
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Where did you expect to find it?
      description: e.g. a nav location, a page that links to it, or a feature that has no matching doc.
    validations:
      required: false
  - type: textarea
    id: related
    attributes:
      label: Related Issues / Links
      description: Mention any related issues or existing pages.
    validations:
      required: false
  - type: input
    id: suggested
    attributes:
      label: Suggested Labels
      description: Optional comma separated list of suggested labels.
    validations:
      required: false
