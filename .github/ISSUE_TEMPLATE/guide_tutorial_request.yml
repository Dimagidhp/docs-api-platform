name: "📘 Request a New Guide or Tutorial"
description: Suggest a new how-to guide or tutorial to add to the documentation.
title: "[Guide/Tutorial]: "
labels: ["DevRel"]
body:
  - type: textarea
    id: description
    attributes:
      label: What guide or tutorial would you like to see?
      description: Describe the task or workflow it should walk through.
      placeholder: e.g. "A step-by-step tutorial on setting up mTLS on the API Gateway."
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Related Section
      description: Which part of the product suite is this related to?
      options:
        - Cloud
        - API Manager
        - API Gateway
        - AI Gateway
        - Developer Portal
        - AI Workspace
        - Analytics
        - Monetization
        - Policy Hub
        - Tools
        - Other
    validations:
      required: true
  - type: textarea
    id: audience
    attributes:
      label: Target Audience / Use Case
      description: Who is this for, and what are they trying to accomplish?
    validations:
      required: false
  - type: textarea
    id: related
    attributes:
      label: Related Issues / Links
      description: Mention any related issues, existing pages, or external references.
    validations:
      required: false
  - type: input
    id: suggested
    attributes:
      label: Suggested Labels
      description: Optional comma separated list of suggested labels.
    validations:
      required: false
